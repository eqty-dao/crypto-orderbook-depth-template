name: Optional Cloudflare Worker Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy Worker to Cloudflare? Requires Cloudflare secrets."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy-worker:
    if: ${{ github.event.inputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop if Cloudflare secrets are missing
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are missing. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, or deploy the Worker manually/from Cloudflare."
            exit 1
          fi

      - name: Deploy Worker with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
